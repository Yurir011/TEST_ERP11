<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BENCH ERP</title>
    <style>
      :root { --bg: #f7f7f8; --card: #ffffff; --fg: #18181b; --muted: #71717a; --line: #e4e4e7; --primary: #2563eb; --danger: #dc2626; --ok: #16a34a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111113; --card: #1b1b1f; --fg: #f4f4f5; --muted: #a1a1aa; --line: #2e2e33; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
             font: 14px/1.5 "Malgun Gothic", system-ui, sans-serif; }
      main { width: min(440px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
      h1 { margin: 0 0 4px; font-size: 22px; }
      p { margin: 0 0 16px; color: var(--muted); }
      label { display: block; margin-bottom: 6px; font-weight: 600; }
      input { width: 100%; padding: 10px 12px; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
      input:focus { outline: 2px solid var(--primary); outline-offset: 0; }
      .row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
      button { padding: 10px 16px; font: inherit; font-weight: 600; color: #fff; background: var(--primary); border: 0; border-radius: 10px; cursor: pointer; }
      button.secondary { color: var(--fg); background: transparent; border: 1px solid var(--line); }
      button:disabled { opacity: 0.6; cursor: default; }
      .error { margin-top: 12px; color: var(--danger); min-height: 1.5em; }
      .nfc { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <section id="setup" hidden>
        <h1>서버 연결</h1>
        <p>사내 ERP 서버 주소를 입력하세요. 관리자에게 받은 주소를 그대로 쓰면 됩니다.</p>
        <form id="form">
          <label for="url">서버 주소</label>
          <input id="url" placeholder="http://192.168.0.10" autocomplete="off" spellcheck="false" />
          <div class="row"><button id="save" type="submit">연결</button></div>
        </form>
      </section>
      <section id="offline" hidden>
        <h1>서버에 연결할 수 없습니다</h1>
        <p id="server"></p>
        <div class="row">
          <button id="retry" type="button">다시 시도</button>
          <button id="change" class="secondary" type="button">서버 주소 변경</button>
        </div>
      </section>
      <div id="error" class="error" role="alert"></div>
      <div class="nfc">NFC 리더: <span id="nfc">확인 중...</span> · <span id="ver"></span></div>
    </main>
    <script>
      const api = window.benchClient;
      const $ = (id) => document.getElementById(id);
      const NFC_TEXT = { ready: "연결됨", searching: "리더를 찾는 중", connecting: "연결하는 중", busy: "다른 프로그램이 사용 중", error: "오류" };

      function show(mode) {
        $("setup").hidden = mode !== "setup";
        $("offline").hidden = mode !== "offline";
        if (mode === "setup") $("url").focus();
      }
      function nfcText(s) {
        if (!s) return "알 수 없음";
        return (NFC_TEXT[s.state] || s.state) + (s.port ? " (" + s.port + ")" : "");
      }

      async function init() {
        $("ver").textContent = await api.getVersion();
        const st = await api.shell.state();
        $("url").value = st.serverUrl || "";
        $("server").textContent = st.serverUrl || "";
        $("error").textContent = st.error || "";
        show(st.mode);
        $("nfc").textContent = nfcText(await api.nfc.status());
        api.nfc.onStatus((s) => { $("nfc").textContent = nfcText(s); });
      }

      $("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        $("error").textContent = "";
        $("save").disabled = true;
        $("save").textContent = "연결 중...";
        const r = await api.shell.saveServer($("url").value);
        if (!r.ok) {
          $("error").textContent = r.error || "연결하지 못했습니다.";
          $("save").disabled = false;
          $("save").textContent = "연결";
        }
      });
      $("retry").addEventListener("click", () => { $("error").textContent = ""; api.shell.retry(); });
      $("change").addEventListener("click", () => { $("error").textContent = ""; show("setup"); $("url").select(); });

      init();
    </script>
  </body>
</html>
